server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints asset filenames, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Client-side routing: every unknown path serves the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Do not let browsers cache the shell, so a new deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
