name: eabd-learning-platform

services:
  web:
    build:
      context: .
      args:
        # Compose interpolates these from the shell or from --env-file.
        # It does not read .env.local on its own.
        #   docker compose --env-file .env.local up --build
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
