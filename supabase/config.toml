project_id = "eabd-learner-record-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The Docker review build serves on 8080, so local sign-in redirects must allow it.
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:5174/**",
  "http://localhost:8080/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Development only. The built-in mailer allows a handful of emails per hour,
# so confirmation is skipped on the test project. Turn this back on, with real
# SMTP, before any production rollout.
enable_confirmations = false

[functions.extract-document]
verify_jwt = true
